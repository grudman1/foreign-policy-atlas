<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foreign Policy Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
/* ============================================================
   FOREIGN POLICY ATLAS — immersive map-first redesign
   Map fills the viewport; all UI floats over it.
   ============================================================ */

:root{
  /* Typography */
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

  /* Warm editorial neutrals */
  --bg:#F4EFE3;
  --panel:#FFFFFF;
  --panel-glass:rgba(255, 252, 244, 0.94);
  --ink:#1F1E18;
  --ink2:#4F4D44;
  --ink3:#807E73;
  --line:#E2DDCE;
  --line2:#EDE9DC;
  --chip:#F1EDE0;

  /* Friendlier warm accent (replaces the cool blue) */
  --accent:#B85C38;
  --accent-soft:rgba(184, 92, 56, 0.12);

  /* State colors — DO NOT recolor; this is the data encoding */
  --s-core:        #2F6F4F;
  --s-aligned:     #5f9618;
  --s-neutral:     #9b998f;
  --s-strained:    #B07D1A;
  --s-adversarial: #DD4140;
  --s-us:          #5F5E5A;

  --nd:#E8E2D0; --stroke:#FFFFFF;
  --good:#5f9618; --mid:#B07D1A; --bad:#C2403F;
  --lbl:#4F4D44; --lblbg:#FFFFFF;
  --arrow-fill:#FFFFFF; --arrow-outline:#161616;
  --ocean:#B8C8D8; --water:#7A9EBA;

  /* Floating chrome shadows */
  --shadow-float:0 6px 24px rgba(31, 30, 24, 0.10), 0 1px 3px rgba(31, 30, 24, 0.05);
  --shadow-deep:0 18px 52px rgba(31, 30, 24, 0.16), 0 2px 6px rgba(31, 30, 24, 0.06);

  --radius-card:14px;
  --radius-pill:999px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15161A;
    --panel:#22242A;
    --panel-glass:rgba(34, 36, 42, 0.92);
    --ink:#ECEAE0;
    --ink2:#A8A69B;
    --ink3:#7A786E;
    --line:#34363D;
    --line2:#2A2C32;
    --chip:#2A2C32;
    --accent:#E8907A;
    --accent-soft:rgba(232, 144, 122, 0.18);
    --s-core:        #4F8C6A;
    --s-aligned:     #97C459;
    --s-neutral:     #6e6d66;
    --s-strained:    #D4A53A;
    --s-adversarial: #E97A79;
    --s-us:          #B4B2A9;
    --nd:#2A2B30; --stroke:#1A1B1F;
    --good:#97C459; --mid:#D4A53A; --bad:#E97A79;
    --lbl:#A8A69B; --lblbg:#22242A;
    --arrow-fill:#FFFFFF; --arrow-outline:#161616;
    --ocean:#1C2B3A; --water:#2D4558;
    --shadow-float:0 6px 24px rgba(0,0,0,0.40), 0 1px 3px rgba(0,0,0,0.20);
    --shadow-deep:0 18px 52px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.25);
  }
  .mtn-sym{ fill:rgba(175,145,100,0.52); }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  font-family:var(--font-body);
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:"cv11","ss01";
}

/* ---- Full-bleed map canvas ---- */
.map-canvas{
  position:fixed;inset:0;z-index:0;
  background:var(--bg);
  overflow:hidden;
}
.map-canvas svg{width:100%;height:100%;display:block;cursor:grab}
.map-canvas svg:active{cursor:grabbing}
.map-canvas .map-loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:13px;
}
.phy-ocean{pointer-events:none;fill:var(--ocean)}
.phy-graticule{fill:none;stroke:var(--water);stroke-width:0.3;opacity:0.35;pointer-events:none}
.phy-rivers{fill:none;stroke:var(--water);stroke-width:0.55;opacity:0.65;pointer-events:none}
.phy-lakes{fill:var(--water);opacity:0.45;stroke:none;pointer-events:none}
.mtn-sym{fill:rgba(90,65,40,0.42);pointer-events:none;user-select:none}
.cty{cursor:pointer;transition:opacity .15s, stroke-width .15s}
.cty:hover{opacity:.78}
.cty.sel{stroke:var(--ink);stroke-width:1.4}
.cty.dimmed{opacity:.26}
.map-canvas svg .cty,
.map-canvas svg .rgoutline,
.map-canvas svg .rglead{vector-effect:non-scaling-stroke}
.rgoutline{fill:none;stroke:var(--ink);stroke-width:1.7;pointer-events:none;
  stroke-linejoin:round;opacity:0;transition:opacity .2s}
.rgoutline.show{opacity:.92}
.rglabel{cursor:pointer}
.rghit{fill:var(--ink);opacity:0;transition:opacity .12s}
.rglabel:hover .rghit{opacity:.07}
.rglabel.active .rghit{opacity:.09}
.rglabel text{font-size:12px;font-weight:700;font-family:var(--font-body);fill:var(--lbl);
  paint-order:stroke;stroke:var(--lblbg);stroke-width:4.5px;stroke-linejoin:round;letter-spacing:.02em}
.rglabel:hover text{fill:var(--accent)}
.rglead{stroke:var(--ink3);stroke-width:0.8;fill:none;opacity:.55}
.rglabel.active text{fill:var(--ink);font-size:13px}
.rglabel.active .rgdot{fill:var(--ink)}
.rgdot{fill:var(--ink3)}

/* ---- Floating top bar ---- */
.topbar{
  position:fixed;top:14px;left:14px;right:14px;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:10px 16px;
  background:var(--panel-glass);
  backdrop-filter:saturate(140%) blur(14px);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  border:1px solid var(--line);
  border-radius:var(--radius-pill);
  box-shadow:var(--shadow-float);
  animation:slideDown .5s cubic-bezier(.2,.7,.2,1) both;
}
.topbar-left{display:flex;align-items:baseline;gap:14px;min-width:0;flex:1 1 auto}
.title{
  font-family:var(--font-display);
  font-weight:600;font-size:21px;letter-spacing:-0.01em;
  margin:0;color:var(--ink);white-space:nowrap;
}
.blurb{font-size:12.5px;color:var(--ink3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:none}
@media (min-width:1100px){ .blurb{display:inline} }
.topbar-right{display:flex;align-items:center;gap:10px;flex:none}
.presel-wrap{display:flex;align-items:center;gap:7px}
.presel-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600}
.presel-wrap select{
  font-family:inherit;font-size:13.2px;font-weight:500;
  padding:6px 28px 6px 12px;border:1px solid var(--line);border-radius:var(--radius-pill);
  background:var(--panel) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='none' stroke='%23807E73' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round' d='M1 1l4 4 4-4'/></svg>") no-repeat right 10px center;
  color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none;
}
.presel-wrap select:focus{outline:none;border-color:var(--accent)}
.asof{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.meth-btn{
  font-family:inherit;font-size:12px;font-weight:500;
  padding:6px 12px;border:1px solid var(--line);border-radius:var(--radius-pill);
  background:transparent;color:var(--ink2);cursor:pointer;
  transition:border-color .15s, color .15s, background .15s;
}
.meth-btn:hover{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.meth-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- Floating left controls (search + legend card) ---- */
.controls-left{
  position:fixed;top:78px;left:14px;z-index:15;
  display:flex;flex-direction:column;gap:10px;
  width:300px;max-width:calc(100vw - 28px);
  animation:slideIn .55s cubic-bezier(.2,.7,.2,1) both;
  animation-delay:.08s;
}
.search-pill{
  display:flex;align-items:center;gap:9px;
  padding:0 14px;height:40px;
  background:var(--panel-glass);
  backdrop-filter:saturate(140%) blur(14px);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  border:1px solid var(--line);
  border-radius:var(--radius-pill);
  box-shadow:var(--shadow-float);
  transition:border-color .15s;
}
.search-pill:focus-within{border-color:var(--accent)}
.search-icon{width:15px;height:15px;color:var(--ink3);flex:none}
.search{
  flex:1;border:0;background:transparent;outline:none;
  font:inherit;color:var(--ink);height:100%;padding:0;font-size:13.5px;
}
.search::placeholder{color:var(--ink3)}

.legend-card{
  background:var(--panel-glass);
  backdrop-filter:saturate(140%) blur(14px);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-float);
  overflow:hidden;
}
.legend-toggle{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:11px 14px;background:transparent;border:0;cursor:pointer;
  font:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);
  text-transform:uppercase;letter-spacing:.06em;
}
.legend-toggle-chev{font-size:14px;color:var(--ink3);transition:transform .2s;line-height:1}
.legend-card.collapsed .legend-toggle-chev{transform:rotate(180deg)}
.legend-body{padding:0 14px 13px;transition:max-height .25s ease, opacity .2s ease}
.legend-card.collapsed .legend-body{display:none}
.legend-hint{font-size:11.5px;color:var(--ink3);margin:0 0 8px;line-height:1.5}
.legend{display:flex;flex-direction:column;gap:4px}
.legrow{display:flex;flex-wrap:wrap;gap:3px 4px;align-items:center}
.legrow .leglabel{font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink3);font-weight:600;width:100%;margin:6px 0 2px}
.legend button{
  display:inline-flex;align-items:center;gap:6px;font-size:11.8px;color:var(--ink2);
  background:transparent;border:0;padding:3px 6px;border-radius:7px;cursor:pointer;font-family:inherit;
  transition:background .12s;
}
.legend button:hover{background:var(--line2)}
.legend button.dim{opacity:.36}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.count{display:inline-block;background:var(--line2);color:var(--ink2);font-size:10.5px;
  padding:0 6px;border-radius:20px;margin-left:3px;vertical-align:middle;line-height:1.4}
.darr{font-weight:700;font-size:12.5px;line-height:1;display:inline-block;
  min-width:16px;text-align:center;color:var(--ink)}

/* ---- Floating zoom controls ---- */
.zoom-controls{
  position:fixed;bottom:18px;left:14px;z-index:15;
  display:flex;flex-direction:column;gap:6px;
  background:var(--panel-glass);
  backdrop-filter:saturate(140%) blur(14px);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  padding:4px;
  box-shadow:var(--shadow-float);
}
.zbtn{
  font-family:inherit;font-size:14px;font-weight:600;
  width:36px;height:36px;
  border:0;background:transparent;color:var(--ink2);
  border-radius:8px;cursor:pointer;
  transition:background .12s, color .12s;
  display:flex;align-items:center;justify-content:center;
}
.zbtn:hover{background:var(--line2);color:var(--ink)}
.zbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zreset{font-size:10.5px;font-weight:600;width:auto;padding:0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}

/* ---- Docked right-side panel ---- */
.dock{
  /* top:78px = clear of the floating top bar (which sits at top:14 with ~58px height).
     Dropping below the top bar prevents the bar from covering the Dossier/Ask AI tab strip. */
  position:fixed;top:78px;right:14px;bottom:14px;z-index:18;
  width:380px;max-width:calc(100vw - 28px);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-deep);
  display:flex;flex-direction:column;
  overflow:hidden;
  animation:slideInRight .6s cubic-bezier(.2,.7,.2,1) both;
  animation-delay:.12s;
  transition:width .28s cubic-bezier(.2,.7,.2,1);
}
/* Desktop-only: the expand button widens the dock for more reading room.
   Scoped to (min-width:721px) so it never clobbers the mobile bottom-sheet
   (which sets width:100% — a mobile-only override below also forces that). */
@media (min-width:721px){
  .dock.expanded{ width:min(820px, calc(100vw - 28px)); }
}
.dock-expand{
  margin-left:4px;margin-right:8px;margin-bottom:6px;
  font-family:inherit;font-size:14px;line-height:1;
  width:30px;height:28px;padding:0;
  border:1px solid var(--line);border-radius:8px;
  background:transparent;color:var(--ink2);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .15s, color .15s, background .15s;
}
.dock-expand:hover{border-color:var(--accent);color:var(--ink)}
.dock-expand[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dock-expand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Static (non-interactive) region label — same look as .reg but no hover */
.reg.reg-static{cursor:default}
.reg.reg-static:hover{color:var(--ink3);text-decoration:none}
.dock-tabs{
  display:flex;align-items:center;gap:2px;
  padding:8px 8px 0 8px;
  border-bottom:1px solid var(--line);
}
.dock-tab{
  flex:0 0 auto;padding:9px 16px;font-size:13px;font-weight:500;font-family:inherit;
  background:transparent;border:0;color:var(--ink3);cursor:pointer;border-radius:9px 9px 0 0;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .15s, background .15s, border-color .15s;
}
.dock-tab:hover{color:var(--ink2);background:var(--line2)}
.dock-tab.on{color:var(--ink);border-bottom-color:var(--accent);background:transparent}
.dock-tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dock-overview{
  margin-left:auto;margin-right:8px;margin-bottom:6px;
  font-family:inherit;font-size:11.5px;font-weight:500;
  padding:5px 11px;border:1px solid var(--line);border-radius:var(--radius-pill);
  background:transparent;color:var(--ink2);cursor:pointer;
  transition:border-color .15s, color .15s;
}
.dock-overview:hover{border-color:var(--accent);color:var(--ink)}
.dock-body{flex:1;min-height:0;position:relative;overflow:hidden;pointer-events:none}
.dock-pane{
  position:absolute;inset:0;
  overflow:hidden;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
}
.dock-pane.on{opacity:1;pointer-events:none}
/* Scroll and hit-test live on the inner container so the empty area below
   short content passes pointer events through to the map beneath */
.pinner{padding:18px 20px 22px;overflow-y:auto;overflow-x:hidden;max-height:100%;pointer-events:auto}
.aspane{padding:16px 18px 20px;overflow-y:auto;overflow-x:hidden;max-height:100%;pointer-events:auto}

/* ---- Dock visibility: hidden when nothing is selected ----
   Augments the base .dock transition with transform + opacity so the slide-out
   animates. When .dock-hidden is on, the dock translates off-screen, fades,
   and gives up pointer events so the map underneath stays interactive. */
.dock{transition:transform .28s cubic-bezier(.2,.7,.2,1),
                 opacity .22s ease,
                 width .28s cubic-bezier(.2,.7,.2,1)}
.dock.dock-hidden{
  /* Suppress the initial-mount slideInRight animation so the dock doesn't
     briefly fly in from the right before snapping off-screen on first load. */
  animation:none;
  transform:translateX(calc(100% + 28px));
  opacity:0;pointer-events:none;
}

/* ---- Floating "Panel" toggle (visible only when the dock is hidden) ----
   Same glass treatment as the search and legend cards. Clicking it brings the
   dock back, defaulting to the Ask AI tab so the empty Dossier state isn't
   the first thing the user lands on. */
.dock-open-btn{
  position:fixed;top:78px;right:14px;z-index:18;
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;
  background:var(--panel-glass);
  backdrop-filter:saturate(140%) blur(14px);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  border:1px solid var(--line);
  border-radius:var(--radius-pill);
  box-shadow:var(--shadow-float);
  font-family:inherit;font-size:12.5px;font-weight:500;
  color:var(--ink2);cursor:pointer;
  transition:border-color .15s, color .15s, background .15s, transform .15s;
}
.dock-open-btn[hidden]{display:none}
.dock-open-btn:hover{border-color:var(--accent);color:var(--ink);
  background:var(--accent-soft)}
.dock-open-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dock-open-glyph{font-size:11px;color:var(--ink3);transition:color .15s;line-height:1}
.dock-open-btn:hover .dock-open-glyph{color:var(--accent)}

/* ---- Dossier content (preserves every credibility signal) ---- */
.ph{display:flex;align-items:center;gap:9px;margin-bottom:4px;flex-wrap:wrap}
.ph .sw{width:14px;height:14px}
.ph h2{font-family:var(--font-display);font-size:21px;font-weight:600;margin:0;letter-spacing:-0.01em;line-height:1.2}
.ph .exports{display:inline-flex;align-items:center;gap:4px;margin-left:2px;font-size:17px;line-height:1}
.ph .exp-sym{cursor:default;filter:saturate(.9)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
  padding:3px 10px;border-radius:20px;background:var(--chip);color:var(--ink2)}
.badge .sw{width:10px;height:10px}
.badge .darr{font-size:12px;min-width:auto}
.badge b{color:var(--ink);font-weight:600}
.reg{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;
  margin:10px 0 12px;cursor:pointer;transition:color .12s}
.reg:hover{color:var(--accent);text-decoration:underline}
.baseline{margin:10px 0 13px;padding:10px 12px;background:var(--chip);
  border-radius:10px;font-size:12.7px;line-height:1.55;color:var(--ink2)}
.baseline .blab{display:block;font-size:10px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink3);font-weight:600;margin-bottom:4px}
ul.pts{margin:0;padding:0;list-style:none}
ul.pts li{position:relative;padding:0 0 11px 17px;font-size:13.5px;line-height:1.55}
ul.pts li:before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--dotc)}
.interp{margin-top:4px;font-size:11.5px;color:var(--ink3);font-style:italic;
  border-top:1px dashed var(--line);padding-top:10px}
.outcome{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.outcome h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:0 0 10px}
.ocell{display:flex;gap:9px;margin-bottom:9px;font-size:12.9px;line-height:1.5}
.otag{flex:none;width:62px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding-top:1px}
.otag.g{color:var(--good)} .otag.m{color:var(--mid)} .otag.b{color:var(--bad)}

/* ---- v3 dossier additions — reuse the .baseline chip style with subtle
        accents so the three blocks (inherited / outcome / counterargument)
        are visually distinct without inventing a new visual language. ---- */
.outcome-line{margin:10px 0 13px;padding:10px 12px;background:var(--chip);
  border-radius:10px;font-size:12.7px;line-height:1.55;color:var(--ink);
  border-left:3px solid var(--accent)}
.outcome-line .blab{display:block;font-size:10px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink3);font-weight:600;margin-bottom:4px}
.counterarg{margin:10px 0 13px;padding:10px 12px;background:var(--chip);
  border-radius:10px;font-size:12.7px;line-height:1.55;color:var(--ink2);
  border-left:3px solid var(--mid)}
.counterarg .blab{display:block;font-size:10px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink3);font-weight:600;margin-bottom:6px}
/* Outcome (continued) — the rest of the `outcome` paragraph that didn't fit in
   the Inherited→Now "Now" line. Same chip treatment as .counterarg but neutral
   (no left accent) since it's continuation rather than a flagged alternative. */
.outcome-rest{margin:10px 0 13px;padding:10px 12px;background:var(--chip);
  border-radius:10px;font-size:13px;line-height:1.55;color:var(--ink2)}
.outcome-rest .blab{display:block;font-size:10px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink3);font-weight:600;margin-bottom:6px}
.userdir{margin:10px 0 13px;padding:10px 12px;background:var(--chip);
  border-radius:10px;font-size:12.5px;line-height:1.5;color:var(--ink2);
  border-left:3px solid var(--bad)}
.userdir .blab{display:block;font-size:10px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--bad);font-weight:600;margin-bottom:4px}
.metachips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.metachip{display:inline-flex;align-items:baseline;gap:6px;font-size:11.5px;
  padding:3px 10px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--ink2)}
.metachip .mclab{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600}
.metachip .mcval{color:var(--ink);font-weight:500;text-transform:capitalize}
/* Each labelled note (Five Levers row, conditional note) renders as a
   self-contained block: bold uppercase label on its own line, prose
   underneath, with a thin divider between siblings so the section scans
   cleanly. Avoids the inline label-runs-into-text problem. */
.condnote{font-size:13px;line-height:1.55;color:var(--ink2);
  margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.condnote:first-child{margin-top:4px;padding-top:0;border-top:0}
.condnote-lab{display:block;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink3);font-weight:600;margin-bottom:6px}
.sources{margin:4px 0 0;padding:0;list-style:none;font-size:12.4px;line-height:1.5}
.sources li{padding:3px 0;color:var(--ink2)}
.sources a{color:var(--accent);text-decoration:none}
.sources a:hover{text-decoration:underline}
.linked-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.linkchip{font-family:inherit;font-size:12px;padding:4px 11px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer;
  transition:border-color .12s, color .12s, background .12s}
.linkchip:hover{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}

/* ---- Prose-block primitives — used everywhere prose is rendered (Inherited
   row, Now row, outcome remainder, counterargument). The principle: don't mix
   bullets and sentences in a single block. Authors choose by value shape
   (string vs. array) and the renderer routes through these classes. Font-size
   and color inherit so each parent container (inh-row, counterarg,
   outcome-rest) sets its own typography. */
.prose-p{margin:0 0 8px;line-height:1.6;color:inherit;font-size:inherit}
.prose-p:last-child{margin-bottom:0}
.prose-bullets{margin:0;padding:0;list-style:none}
.prose-bullets > li{
  position:relative;padding:6px 0 6px 18px;
  line-height:1.55;color:inherit;font-size:inherit;
}
.prose-bullets > li + li{border-top:1px solid var(--line2)}
.prose-bullets > li:before{
  content:"";position:absolute;left:4px;top:14px;
  width:5px;height:5px;border-radius:50%;background:currentColor;
  opacity:.5;
}

/* ---- v3 redesign: at-a-glance Inherited → Now block ----
   Replaces the standalone .baseline and .outcome-line blocks. Two stacked rows
   separated by a thin divider; left accent bar visually anchors it as the
   "headline summary" of the dossier. */
.inh-now{
  margin:14px 0 16px;
  background:var(--chip);
  border-radius:12px;
  padding:14px 16px;
  border-left:3px solid var(--accent);
}
.inh-row{font-size:13.5px}
.inh-row + .inh-row{
  margin-top:11px;padding-top:11px;
  border-top:1px solid var(--line);
}
.inh-lab{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink3);font-weight:600;margin-bottom:6px}
.inh-before{color:var(--ink2)}
.inh-after{color:var(--ink)}
.inh-after .prose-p,
.inh-after .prose-bullets > li{font-weight:500}

/* ---- v3 redesign: collapsible drill-down sections (<details>) ----
   Editorial accordion: thin top divider, uppercase title, chevron rotates on
   open. .dsec-meta is a tiny "(3 points)" / "(8 sources)" counter so closed
   sections still telegraph what they hold. */
.dsec{margin-top:4px;border-top:1px solid var(--line2)}
.dsec:first-of-type{margin-top:14px}
.dsec[open]{padding-bottom:6px}
.dsec-h{
  display:flex;align-items:center;gap:8px;
  padding:11px 0;cursor:pointer;list-style:none;user-select:none;
}
.dsec-h::-webkit-details-marker{display:none}
.dsec-h::marker{content:""}
.dsec-title{flex:1;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;
  font-weight:600;color:var(--ink2);transition:color .12s}
.dsec-meta{font-size:11px;color:var(--ink3);font-weight:500;
  text-transform:none;letter-spacing:0}
.dsec-chev{font-size:11px;color:var(--ink3);transition:transform .2s;
  line-height:1;display:inline-block}
.dsec[open] .dsec-chev{transform:rotate(180deg)}
.dsec-h:hover .dsec-title,
.dsec-h:hover .dsec-chev{color:var(--accent)}
.dsec-h:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.dsec-body{padding:2px 0 12px}
.dsec-sublab{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink3);font-weight:600;margin:12px 0 6px}

/* ---- Honesty pills (contested / editor-directed) sit next to the badges.
   Italic-outlined so they read as warnings without alarmism. */
.badge.badge-warn{background:transparent;color:var(--mid);
  border:1px solid var(--mid);font-style:italic}

.sech{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:18px 0 8px}
.rgoal{font-size:13.2px;background:var(--chip);border-radius:10px;padding:11px 13px;margin:4px 0 2px;line-height:1.55}
.proj{position:relative;padding:0 0 8px 15px;font-size:13px;line-height:1.5}
.proj:before{content:"";position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:1px;background:var(--s-aligned)}
.tiltbadge{display:inline-block;font-size:11.5px;padding:3px 11px;border-radius:20px;
  background:var(--chip);color:var(--ink);font-weight:500;margin-bottom:10px}
.backrow{margin-bottom:11px}
.backrow button{font-size:11.5px;background:none;border:0;color:var(--accent);cursor:pointer;
  font-family:inherit;padding:0}
.backrow button:hover{text-decoration:underline}

/* ---- Friendly empty state ---- */
.empty-state{padding:20px 4px 8px}
.empty-h{
  font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-0.01em;
  margin:0 0 7px;color:var(--ink);line-height:1.25;
}
.empty-state .empty-lead{font-size:13.6px;color:var(--ink2);margin:0 0 16px;line-height:1.55}
.empty-sub{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600;margin:0 0 8px}
.reglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.reglist button{
  font-family:inherit;font-size:12px;padding:5px 11px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer;
  transition:border-color .12s, color .12s, background .12s;
}
.reglist button:hover{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}

/* ---- Ask AI pane ---- */
.aspane-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.aspane-title{
  font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:-0.01em;
  margin:0;color:var(--ink);
}
.acontext{font-size:11.8px;color:var(--ink3)}
.acontext b{color:var(--ink2);font-weight:500}
.abtnrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.abtn{
  font-size:12.5px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--ink2);cursor:pointer;font-family:inherit;
  transition:border-color .12s, color .12s, background .12s;
}
.abtn:hover:not(:disabled){border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.abtn.asel{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.abtn:disabled{opacity:.5;cursor:default}
.acustomrow{display:flex;gap:7px;margin-bottom:14px}
.acustomrow .ainput{
  flex:1;font:inherit;font-size:13px;
  padding:8px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);
}
.acustomrow .ainput:focus{outline:none;border-color:var(--accent)}
.asend{
  font-family:inherit;font-size:12.5px;padding:8px 15px;border-radius:9px;border:0;
  background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;flex:none;font-weight:500;
  transition:opacity .12s;
}
.asend:hover:not(:disabled){opacity:.88}
.asend:disabled{opacity:.5;cursor:default}
.aresult{font-size:13.4px;line-height:1.65;color:var(--ink)}
.aresult p{margin:0 0 11px}
.aresult p:last-of-type{margin-bottom:0}
.aresult h4{font-family:var(--font-display);font-size:14.5px;font-weight:600;margin:14px 0 7px}
.aresult ul{margin:0 0 11px;padding-left:18px}
.aresult li{margin-bottom:4px}
.aresult .aload{color:var(--ink3);font-style:italic}
.aclear{
  display:block;margin-top:12px;font-size:11.5px;background:none;border:0;
  color:var(--ink3);cursor:pointer;font-family:inherit;padding:0;
}
.aclear:hover{color:var(--ink)}

/* ---- Methodology modal ---- */
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal-backdrop{position:absolute;inset:0;background:rgba(15,14,10,0.42);
  cursor:pointer;animation:fadeIn .2s ease both}
.modal-panel{
  position:relative;z-index:1;
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;
  padding:24px 28px 26px;
  max-width:680px;width:100%;
  max-height:85vh;overflow-y:auto;
  box-shadow:var(--shadow-deep);
  animation:popIn .25s cubic-bezier(.2,.8,.2,1.05) both;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:8px}
.modal-head h2{
  font-family:var(--font-display);font-size:22px;font-weight:600;margin:0;letter-spacing:-0.01em;
}
.modal-close{
  font-family:inherit;font-size:22px;line-height:1;
  width:34px;height:34px;border:0;background:transparent;color:var(--ink3);
  border-radius:8px;cursor:pointer;
}
.modal-close:hover{background:var(--line2);color:var(--ink)}
.modal-body{font-size:13px;color:var(--ink2);line-height:1.65;padding-top:6px}

/* ---- Methodology iframe overlay variant of the modal ----------------
   Wider than the default .modal-panel so the embedded methodology page
   (its own typography, hero, sections) has room to breathe. The iframe
   stretches via flex; the × button floats on top-right against the
   page's own background. */
.modal-panel--methodology {
  width: min(1100px, 95vw);
  height: 92vh;
  max-width: none;
  max-height: 92vh;
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-panel--methodology .modal-close {
  position: absolute;
  top: 10px; right: 12px;
  z-index: 2;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-float);
}
.methodology-iframe {
  flex: 1;
  width: 100%;
  border: 0;
  display: block;
  background: var(--bg);
}

/* ---- Evidence-pack modal -----------------------------------------------
   Sibling of #methodologyModal. Wider than the default .modal-panel so the
   structured pack content (timeline list, 7 collapsible memos, sources)
   has room to breathe; capped a bit narrower than the methodology iframe
   variant since it renders DOM, not a full page. All colors use CSS vars
   so dark-mode is automatic; animations honor prefers-reduced-motion via
   the blanket override below. */
.modal-panel--pack{
  width: min(880px, 95vw);
  max-height: 92vh;
  max-width: none;
}
.pack-body{ font-size:13.4px; color:var(--ink); line-height:1.6; padding-top:4px; }
.pack-body .pack-head{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 12px;
  padding-bottom:12px; margin-bottom:14px;
  border-bottom:1px solid var(--line);
}
.pack-body .pack-head h2{
  font-family:var(--font-display); font-size:22px; font-weight:600;
  letter-spacing:-0.01em; margin:0; color:var(--ink);
}
.pack-body .pack-kind{
  font-size:11.5px; text-transform:uppercase; letter-spacing:.07em;
  color:var(--ink3); font-weight:600;
}
.pack-body .pack-meta{
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:11px; color:var(--ink3); line-height:1.45;
  flex-basis:100%; margin-top:4px;
}
.pack-body .pack-meta b{ color:var(--ink2); font-weight:600; }
.pack-body .pack-sech{
  font-size:11.5px; text-transform:uppercase; letter-spacing:.07em;
  color:var(--ink3); font-weight:600; margin:18px 0 8px;
}
.pack-body .pack-block{
  margin:0 0 14px; padding:11px 13px;
  background:var(--chip); border-radius:10px;
  font-size:13px; line-height:1.6; color:var(--ink);
}
.pack-body .pack-block .prose-p:last-child{ margin-bottom:0; }

/* Timeline: a clean, readable dated list. The visual timeline chart ships
   in Project 2; here the data is just made viewable, sorted by author. */
.pack-body .pack-timeline{ list-style:none; padding:0; margin:0; }
.pack-body .pack-timeline > li{
  display:flex; gap:12px; align-items:flex-start;
  padding:10px 0; border-top:1px solid var(--line2);
}
.pack-body .pack-timeline > li:first-child{ border-top:0; padding-top:4px; }
.pack-body .pt-date{
  flex:none; width:84px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:11.5px; color:var(--ink3); padding-top:2px;
}
.pack-body .pt-sign{
  flex:none; width:8px; align-self:stretch;
  border-radius:3px; margin-top:3px; margin-bottom:3px;
}
.pack-body .pt-sign.sign-weakened    { background:var(--bad); }
.pack-body .pt-sign.sign-strengthened{ background:var(--good); }
.pack-body .pt-sign.sign-mixed       { background:var(--ink3); opacity:.55; }
.pack-body .pt-text{ flex:1; min-width:0; }
.pack-body .pt-label{
  font-weight:600; color:var(--ink); font-size:13.4px; line-height:1.4;
}
.pack-body .pt-detail{
  font-size:12.8px; color:var(--ink2); line-height:1.55; margin-top:3px;
}
.pack-body .pt-src{
  font-size:11.5px; color:var(--ink3); margin-top:4px;
}
.pack-body .pt-src a{ color:var(--accent); text-decoration:none; }
.pack-body .pt-src a:hover{ text-decoration:underline; }

/* Lists inside the pack (attribution signals, contested points, gaps). */
.pack-body .pack-list{ list-style:none; padding:0; margin:0; }
.pack-body .pack-list > li{
  position:relative; padding:8px 0 8px 16px;
  font-size:13px; line-height:1.55; color:var(--ink2);
  border-top:1px solid var(--line2);
}
.pack-body .pack-list > li:first-child{ border-top:0; }
.pack-body .pack-list > li:before{
  content:""; position:absolute; left:3px; top:15px;
  width:5px; height:5px; border-radius:50%;
  background:var(--ink3); opacity:.55;
}
.pack-body .pack-list .pl-src{
  display:block; margin-top:3px;
  font-size:11.5px; color:var(--ink3);
}
.pack-body .pack-list .pl-src a{ color:var(--accent); text-decoration:none; }
.pack-body .pack-list .pl-src a:hover{ text-decoration:underline; }

/* Memo sub-sources inside each collapsible memo. Inherits the existing
   .sources styling — the dsec body wraps it. */
.pack-body .pack-memo-sources{ margin:8px 0 0; padding:0; list-style:none;
  font-size:12.2px; line-height:1.5; }
.pack-body .pack-memo-sources li{ padding:2px 0; color:var(--ink3); }
.pack-body .pack-memo-sources a{ color:var(--accent); text-decoration:none; }
.pack-body .pack-memo-sources a:hover{ text-decoration:underline; }

/* Source list at the bottom — reuse .sources via the renderer; here just
   ensure it lives flush inside the pack body. */
.pack-body .sources{ margin-top:4px; }

/* Mobile: tighten timeline date column so the row still fits. */
@media (max-width:720px){
  .pack-body .pt-date{ width:70px; font-size:11px; }
  .modal-panel--pack{ max-height:88vh; }
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ---- Animations ---- */
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:none}}
@keyframes slideInRight{from{opacity:0;transform:translateX(16px)} to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)} to{opacity:1;transform:none}}

/* ---- Reduced motion: blanket override ---- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ---- Mobile: bottom sheet ---- */
@media (max-width:720px){
  .topbar{
    left:8px;right:8px;top:8px;padding:8px 14px;gap:8px;border-radius:18px;
  }
  .title{font-size:17px}
  .topbar-right .presel-label{display:none}
  .topbar-right .asof{display:none}

  .controls-left{
    top:64px;left:8px;right:8px;width:auto;max-width:none;
    flex-direction:row;align-items:flex-start;gap:8px;
  }
  .search-pill{flex:1;min-width:0}
  .legend-card{width:auto;max-width:none;flex:none}
  .legend-card .legend-toggle{padding:8px 12px;font-size:11.5px}

  .zoom-controls{bottom:172px;left:8px;flex-direction:row;padding:3px}
  .zoom-controls .zbtn{width:32px;height:32px;font-size:13px}
  .zoom-controls .zreset{display:none}

  /* The dock becomes a bottom sheet that peeks */
  .dock{
    top:auto;left:0;right:0;bottom:0;
    width:100%;max-width:100%;
    border-radius:20px 20px 0 0;
    border:1px solid var(--line);border-bottom:0;
    height:62vh;
    transform:translateY(calc(62vh - 124px));
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .dock.sheet-open{transform:translateY(0)}
  /* Hidden state on mobile = slide all the way off the bottom (overriding the
     peek transform set above). */
  .dock.dock-hidden{transform:translateY(100%)}
  /* The floating "Panel" button drops to the bottom-right on mobile so it sits
     above the thumb zone rather than competing with the top legend/search. */
  .dock-open-btn{
    top:auto;right:14px;bottom:16px;
    padding:9px 14px;font-size:12px;
  }
  /* Mobile guards: the expand button is a desktop affordance; the bottom
     sheet handles full-screen via the drag handle. Force width:100% so a
     stuck .expanded class can't shrink the sheet. */
  .dock-expand{display:none}
  .dock.expanded{width:100%}
  .dock-handle{
    display:flex;align-items:center;justify-content:center;
    width:100%;padding:8px 0 4px;
    background:transparent;border:0;cursor:pointer;
  }
  .dock-handle span{
    display:block;width:42px;height:4px;border-radius:4px;
    background:var(--ink3);opacity:.45;
  }
  .dock-tabs{padding-top:0}
}
/* Desktop: hide the handle entirely (sheet behavior is mobile-only) */
@media (min-width:721px){
  .dock-handle{display:none}
}

/* ---- Hide the page-level scrollbars on mobile WebKit when the sheet animates ---- */
@media (max-width:720px){
  body{overscroll-behavior:none}
}

/* =====================================================================
   Dossier visualization (.dsv-*) — additive presentation layer.
   Each section is rendered by its own builder in app.js and returns ""
   when its inputs are absent, so v2 entries, unscored entries, the US
   home cell, and entries without a pack all render gracefully.
   All colors use CSS variables (dark-mode automatic). No animations.
   ===================================================================== */
.dsv-section{ margin:20px 0 0; }
.dsv-eyebrow{
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--ink3); font-weight:600; margin:0 0 8px;
}

/* -- B. The verdict ----------------------------------------------------
   Headline carries the visual weight; the explainer is a short clipped
   clause so the top doesn't dominate. Full verbatim outcome lives in
   the footer's "Full causal argument" details. */
.dsv-verdict{ margin:14px 0 18px; }
.dsv-verdict-h{
  font-family:var(--font-display);
  font-size:28px; line-height:1.18; font-weight:600;
  letter-spacing:-0.014em; color:var(--ink);
  margin:6px 0 8px;
}
.dsv-verdict-h .dsv-verb-helped{ color:var(--good); }
.dsv-verdict-h .dsv-verb-hurt  { color:var(--bad); }
.dsv-verdict-clause{
  display:block; font-family:var(--font-body);
  font-size:11.5px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink3); margin-top:8px;
}
.dsv-verdict-outcome{
  margin:12px 0 0; font-size:14px; line-height:1.55; color:var(--ink2);
}

/* -- C. Trajectory chart -----------------------------------------------
   Big and bold. Inline endpoint labels remove the need for a separate
   legend row. Bold start dot at Jan 2025; bold endpoint dots; arrow at
   the actual endpoint; large mono magnitude callout. */
.dsv-traj{
  background:var(--chip);
  border-radius:14px;
  padding:18px 18px 16px;
}
.dsv-traj svg{ width:100%; height:auto; display:block; }
.dsv-traj-axis{
  font-family:var(--font-body);
  font-size:13px; font-weight:600;
  fill:var(--ink2);
}
.dsv-traj-axis-top{ /* "stronger U.S. position" — sits above the path zone */ }
.dsv-traj-axis-bot{ /* "weaker U.S. position"   — sits below the path zone */ }
.dsv-traj-tick{
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:11px; fill:var(--ink3);
}
.dsv-traj-mid     { stroke:var(--ink3); stroke-width:0.7; opacity:.35; stroke-dasharray:2 3; }
.dsv-traj-start-dot{ fill:var(--ink2); }
.dsv-traj-inh     { fill:none; stroke:var(--ink3); stroke-width:1.8; stroke-dasharray:6 6; }
.dsv-traj-inh-dot { fill:var(--panel); stroke:var(--ink3); stroke-width:1.8; }
.dsv-traj-act     { fill:none; stroke-width:3; }
.dsv-traj-act-helped{ stroke:var(--good); }
.dsv-traj-act-hurt  { stroke:var(--bad); }
.dsv-traj-act-mixed { stroke:var(--ink3); }
.dsv-traj-act-dot         { stroke:var(--panel); stroke-width:1.8; }
.dsv-traj-act-dot.dsv-traj-act-helped{ fill:var(--good); }
.dsv-traj-act-dot.dsv-traj-act-hurt  { fill:var(--bad); }
.dsv-traj-act-dot.dsv-traj-act-mixed { fill:var(--ink3); }
.dsv-traj-arrow.dsv-traj-act-helped{ fill:var(--good); }
.dsv-traj-arrow.dsv-traj-act-hurt  { fill:var(--bad); }
.dsv-traj-end-label{
  font-family:var(--font-body);
  font-size:11.5px; font-style:italic;
  fill:var(--ink2);
}
.dsv-traj-end-inh{ fill:var(--ink3); }
.dsv-traj-end-act{ font-style:normal; font-weight:600; }
.dsv-traj-end-act.dsv-traj-act-helped{ fill:var(--good); }
.dsv-traj-end-act.dsv-traj-act-hurt  { fill:var(--bad); }
.dsv-traj-end-act.dsv-traj-act-mixed { fill:var(--ink2); }
.dsv-traj-callout{
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:12.5px; font-weight:600;
}
.dsv-traj-callout.dsv-traj-act-helped{ fill:var(--good); }
.dsv-traj-callout.dsv-traj-act-hurt  { fill:var(--bad); }
.dsv-traj-callout.dsv-traj-act-mixed { fill:var(--ink2); }

/* -- D1. Timeline strip + legend ---------------------------------------
   Horizontal axis shares the same x-window (Jan 2025 → asOf) as the C
   chart so the two surfaces stack with aligned dates. Sign-colored dots
   placed above-line (strengthened), below-line (weakened), or on-line
   (mixed). */
.dsv-tl-strip{
  background:var(--chip);
  border-radius:14px;
  padding:6px 14px 2px;
  margin-top:6px;
}
.dsv-tl-strip svg{ width:100%; height:auto; display:block; }
.dsv-tl-strip-axis{ stroke:var(--ink3); stroke-width:1; opacity:.45; }
.dsv-tl-strip-dot.sign-weakened    { fill:var(--bad); }
.dsv-tl-strip-dot.sign-strengthened{ fill:var(--good); }
.dsv-tl-strip-dot.sign-mixed       { fill:var(--s-neutral); }
.dsv-tl-strip-dot{ stroke:var(--panel); stroke-width:1.4; cursor:default; }

.dsv-tl-legend{
  display:flex; flex-wrap:wrap; gap:14px;
  font-size:11.5px; color:var(--ink3);
  margin:8px 0 14px;
}
.dsv-tl-legpill{
  display:inline-flex; align-items:center; gap:6px;
}

/* -- D2. Event list ----------------------------------------------------
   One row per event: filled sign-colored disc, mono date column "MON 'YY",
   bold label, em-dash, description (prefers event.blurb, falls back to
   event.detail). No connector rail — the strip above is the visual
   timeline; the list is the readable enumeration. */
.dsv-tl-list{ list-style:none; margin:0; padding:0; }
.dsv-tl-list > li{
  display:flex; gap:12px; padding:9px 0; align-items:flex-start;
}
.dsv-tl-list > li + li{ border-top:1px solid var(--line2); }

/* DOT — used both inline in the legend and as the leading marker on each
   list row. The bug fix is `display:inline-block` (was implicit inline,
   which suppresses width/height + the background paint), and the panel-
   color border is replaced with a faint outer ring of var(--line) so the
   sign-colored fill is what the eye sees. */
.dsv-tl-dot{
  display:inline-block;
  width:11px; height:11px; border-radius:50%;
  flex:none; margin-top:5px;
  box-shadow:0 0 0 1px var(--line);
}
.dsv-tl-dot.sign-weakened    { background:var(--bad); }
.dsv-tl-dot.sign-strengthened{ background:var(--good); }
.dsv-tl-dot.sign-mixed       { background:var(--s-neutral); }

.dsv-tl-date{
  width:78px; flex:none; padding-top:3px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:11px; font-weight:600; letter-spacing:.04em;
  color:var(--ink3); text-transform:uppercase;
}
.dsv-tl-text{ flex:1; min-width:0; font-size:13.5px; line-height:1.5; color:var(--ink2); }
.dsv-tl-label{ font-weight:600; color:var(--ink); }
.dsv-tl-dash { color:var(--ink3); margin:0 4px; }
.dsv-tl-body { color:var(--ink2); }
.dsv-tl-src{
  display:block;
  font-size:11.5px; color:var(--ink3); margin-top:4px;
}
.dsv-tl-src a{ color:var(--accent); text-decoration:none; }
.dsv-tl-src a:hover{ text-decoration:underline; }

/* -- F. Certainty / counterargument ------------------------------------ */
.dsv-meta-row{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
.dsv-counter{
  background:var(--chip); border-radius:10px; padding:11px 13px;
  border-left:3px solid var(--mid);
  font-size:13px; line-height:1.6; color:var(--ink2);
}
.dsv-counter h4{
  font-family:var(--font-display);
  font-size:13.2px; font-weight:600; margin:0 0 6px; color:var(--ink);
  letter-spacing:-0.005em;
}

/* -- Mobile tightening --------------------------------------------------- */
@media (max-width:720px){
  .dsv-verdict-h{ font-size:23px; }
  .dsv-tl-date{ width:62px; font-size:10.5px; }
  .dsv-traj{ padding:14px 12px 10px; }
  .dsv-tl-strip{ padding:4px 10px 2px; }
}
</style>
</head>
<body>

<!-- Map fills the viewport -->
<div id="map" class="map-canvas" role="img" aria-label="World map of US foreign-policy alignment">
  <div class="map-loading">Loading map&hellip;</div>
</div>

<!-- Floating top bar -->
<header class="topbar" role="banner">
  <div class="topbar-left">
    <h1 class="title" id="hl">Foreign Policy Atlas</h1>
    <span id="blurb" class="blurb"></span>
  </div>
  <div class="topbar-right">
    <label class="presel-wrap" for="presel">
      <span class="presel-label">President</span>
      <select id="presel" aria-label="Select president"></select>
    </label>
    <span class="asof" id="asof"></span>
    <button class="meth-btn" type="button" onclick="openMethodology()">Methodology</button>
  </div>
</header>

<!-- Floating left column: search + filter/legend -->
<aside class="controls-left" aria-label="Search and filters">
  <div class="search-pill">
    <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="10.3" y1="10.3" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input class="search" id="search" placeholder="Search a country&hellip;" autocomplete="off" aria-label="Search a country">
  </div>
  <div class="legend-card" id="legendCard">
    <button class="legend-toggle" id="legendToggle" type="button"
            onclick="toggleLegend()" aria-expanded="true" aria-controls="legendBody">
      <span class="legend-toggle-label">Filter</span>
      <span class="legend-toggle-chev" aria-hidden="true">&#8964;</span>
    </button>
    <div class="legend-body" id="legendBody">
      <p class="legend-hint">Color = today's state. Arrow = what <em>this</em> president caused vs. the trajectory they inherited.</p>
      <div class="legend" id="legend"></div>
    </div>
  </div>
</aside>

<!-- Floating zoom controls -->
<div class="zoom-controls" role="group" aria-label="Map zoom">
  <button class="zbtn" type="button" onclick="zoomBy(1.4)" aria-label="Zoom in" title="Zoom in">&#43;</button>
  <button class="zbtn" type="button" onclick="zoomBy(1/1.4)" aria-label="Zoom out" title="Zoom out">&minus;</button>
  <button class="zbtn zreset" type="button" onclick="resetMapZoom()" title="Reset map view">Reset</button>
</div>

<!-- Right-side dock: Dossier | Ask AI tabs -->
<aside class="dock" id="dock" aria-label="Selection panel">
  <button class="dock-handle" type="button" onclick="toggleSheet()" aria-label="Expand or collapse panel"><span></span></button>
  <div class="dock-tabs" role="tablist">
    <button id="tabDossier" class="dock-tab on" role="tab" aria-selected="true"
            aria-controls="paneDossier" onclick="setTab('dossier')">Dossier</button>
    <button id="tabAskAI" class="dock-tab" role="tab" aria-selected="false"
            aria-controls="paneAskAI" onclick="setTab('askai')">Ask AI</button>
    <button class="dock-overview" type="button" onclick="goOverview()" title="Clear selection">Overview</button>
    <button class="dock-expand" id="dockExpand" type="button" onclick="toggleDockExpand()"
            aria-pressed="false" title="Expand panel" aria-label="Expand panel">&#10530;</button>
  </div>
  <div class="dock-body">
    <div class="dock-pane on" id="paneDossier" role="tabpanel" aria-labelledby="tabDossier">
      <div class="pinner" id="pbody"></div>
    </div>
    <div class="dock-pane" id="paneAskAI" role="tabpanel" aria-labelledby="tabAskAI">
      <div id="analysisSection" class="aspane aopen">
        <div class="aspane-head">
          <h3 class="aspane-title">Ask AI</h3>
          <span id="acontext" class="acontext"></span>
        </div>
        <div class="abtnrow">
          <button class="abtn" id="abtn0" type="button" onclick="runAnalysis(0)">Regional trends</button>
          <button class="abtn" id="abtn1" type="button" onclick="runAnalysis(1)">Key risks</button>
          <button class="abtn" id="abtn2" type="button" onclick="runAnalysis(2)">Historical context</button>
        </div>
        <div class="acustomrow">
          <input class="ainput" id="acustomq" placeholder="Ask your own question about this foreign policy posture&hellip;" autocomplete="off">
          <button class="asend" type="button" onclick="runCustomQ()">Ask</button>
        </div>
        <div class="aresult" id="aresult"></div>
      </div>
    </div>
  </div>
</aside>

<!-- Floating "Panel" button: visible only while the dock is hidden (no
     selection). Clicking it brings the dock back, defaulting to the Ask AI
     tab so the user can ask global questions without first picking a country.
     `hidden` by default — _setDockHidden() toggles this attribute. -->
<button class="dock-open-btn" id="dockOpenBtn" type="button" onclick="openDockManual()" hidden
        aria-label="Open panel">
  <span class="dock-open-glyph" aria-hidden="true">&#10094;</span>
  <span class="dock-open-label">Panel</span>
</button>

<!-- Methodology modal: iframe overlay onto /methodology.html so the dedicated
     page (with its own styles + built-in Download PDF button) is the canonical
     methodology surface. The page-level Download PDF (window.print() inside
     the iframe) prints just the iframe content, not the parent app. -->
<div class="modal" id="methodologyModal" hidden role="dialog" aria-modal="true" aria-labelledby="methodologyTitle">
  <div class="modal-backdrop" onclick="closeMethodology()"></div>
  <div class="modal-panel modal-panel--methodology">
    <button class="modal-close" type="button" onclick="closeMethodology()" aria-label="Close methodology">&times;</button>
    <h2 id="methodologyTitle" class="sr-only">Methodology</h2>
    <iframe id="methodologyFrame" class="methodology-iframe"
            title="Foreign Policy Atlas methodology"
            aria-labelledby="methodologyTitle"></iframe>
  </div>
</div>

<!-- Evidence-pack modal: opened from the "View the evidence pack" affordance
     in showCountry() when a pack exists for the selected country. Mirrors
     the methodology modal pattern (role=dialog, aria-modal, backdrop-click
     close, Esc handled by the global keydown handler). Content is built as
     DOM by app.js (no iframe). -->
<div class="modal" id="packModal" hidden role="dialog" aria-modal="true" aria-labelledby="packTitle">
  <div class="modal-backdrop" onclick="closePack()"></div>
  <div class="modal-panel modal-panel--pack">
    <button class="modal-close" type="button" onclick="closePack()" aria-label="Close evidence pack">&times;</button>
    <h2 id="packTitle" class="sr-only">Evidence pack</h2>
    <div id="packBody" class="modal-body pack-body"></div>
  </div>
</div>

<!-- Country-level reference data (not per-president). Load before app.js. -->
<script src="data/country-exports.js"></script>
<!-- Data: one file per president. Each registers itself on window.PRESIDENTS. -->
<script src="data/trump.js"></script>
<!-- Add more presidents here, e.g.:
<script src="data/biden.js"></script>
<script src="data/obama.js"></script>  -->

<!-- Evidence packs: one file per <president>/<country>. Each self-registers on
     window.PACKS["<president>"]["<Country>"] and writes nothing else to window.
     Must load AFTER data/<president>.js (so the registry exists alongside the
     dossier) and BEFORE app.js (so showCountry sees them). A dossier entry
     without a pack file is the normal, expected backfill state — no UI is
     rendered for it. Add pack tags below; keep the comment marker so future
     pack includes are easy to find. -->
<script src="data/packs/trump/russia.js"></script>
<!-- FUTURE PACKS — add new pack files here, e.g.:
<script src="data/packs/trump/china.js"></script>
<script src="data/packs/trump/germany.js"></script>  -->

<script src="app.js"></script>
</body>
</html>
